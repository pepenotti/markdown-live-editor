name: Release

# Runs when a version tag such as v0.1.2 is pushed (see "Releasing" in the README), or by hand
# from the Actions tab (or `gh workflow run release.yml -f tag=v0.1.2`) for a tag that already
# exists. It tests and packages that tag's commit, creates the GitHub release with the .vsix
# attached, and publishes to the Marketplace when the VSCE_PAT secret is set and to Open VSX
# when the OVSX_PAT secret is set.
#
# Running it again for the same tag is safe: an existing release gets the .vsix uploaded over
# the old asset, and a registry that already has the version is skipped with a notice.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or publish again, such as v0.1.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release and upload the .vsix
    defaults:
      run:
        # Naming the shell makes GitHub run it with `-eo pipefail`, which the publish steps
        # rely on: they pipe the CLI output through tee.
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Used only when the checked-out tag is older than the ovsx devDependency.
      OVSX_FALLBACK_VERSION: 1.2.0
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag such as v0.1.2"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration tests in VS Code
        run: xvfb-run -a npx vscode-test
      - run: npm run package
      - name: Release notes from the changelog
        run: node scripts/changelog-section.mjs "$VERSION" > release-notes.md
      - name: Create the GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.vsix --clobber
            echo "::notice::The release $TAG already exists, so the .vsix was uploaded over its existing asset."
          else
            gh release create "$TAG" ./*.vsix --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
      # The two registries are independent: each publish step runs once the GitHub release is
      # done, whatever happened to the other one, and a failure in either fails the job.
      - name: Publish to the Marketplace
        if: ${{ !cancelled() && steps.github_release.outcome == 'success' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, so the Marketplace publish was skipped. The .vsix is attached to the release."
            exit 0
          fi
          # With --skip-duplicate, vsce exits 0 and prints "Version X is already published.
          # Skipping publish." when the Marketplace already has this version.
          npx vsce publish --no-dependencies --skip-duplicate --packagePath ./*.vsix 2>&1 | tee "$RUNNER_TEMP/vsce.log"
          if grep -q 'Skipping publish' "$RUNNER_TEMP/vsce.log"; then
            echo "::notice::The Marketplace already has $TAG, so nothing was published there."
          fi
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.github_release.outcome == 'success' }}
        env:
          # ovsx reads the token from OVSX_PAT, so it never appears on a command line.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, so the Open VSX publish was skipped. The .vsix is attached to the release."
            exit 0
          fi
          if [ -x node_modules/.bin/ovsx ]; then
            ovsx=(npx --no-install ovsx)
          else
            ovsx=(npx --yes "ovsx@$OVSX_FALLBACK_VERSION")
          fi
          # With --skip-duplicate, ovsx exits 0 and prints "... is already published. Skipping
          # publish." when Open VSX already has this version.
          "${ovsx[@]}" publish ./*.vsix --skip-duplicate 2>&1 | tee "$RUNNER_TEMP/ovsx.log"
          if grep -q 'Skipping publish' "$RUNNER_TEMP/ovsx.log"; then
            echo "::notice::Open VSX already has $TAG, so nothing was published there."
          fi
