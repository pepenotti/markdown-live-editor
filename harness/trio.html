<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three modes side by side</title>
    <style>
      html, body { height: 100%; margin: 0; background: #e9edf3; font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #3b4452; }
      body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px; box-sizing: border-box; }
      section { display: flex; flex-direction: column; min-width: 0; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 30, 50, 0.12), 0 8px 24px rgba(20, 30, 50, 0.08); }
      h2 { margin: 0; padding: 9px 14px; font: inherit; letter-spacing: 0.02em; border-bottom: 1px solid #e3e7ee; background: #f7f9fc; }
      iframe { flex: 1; border: 0; width: 100%; }
    </style>
  </head>
  <body>
    <section><h2>Raw</h2><iframe name="raw" src="index.html?doc=demo.md&mode=raw&toolbar=0"></iframe></section>
    <section><h2>Half preview</h2><iframe name="half" src="index.html?doc=demo.md&mode=half&toolbar=0"></iframe></section>
    <section><h2>Full preview</h2><iframe name="full" src="index.html?doc=demo.md&mode=full&toolbar=0"></iframe></section>
  </body>
</html>
